<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Reset your Nero Chat password</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f5;
            color: #18181b;
            margin: 0;
            padding: 32px 16px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 32px;
            border: 1px solid #e4e4e7;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: #18181b;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            margin: 12px 0;
            color: #3f3f46;
        }

        .otp-box {
            margin: 24px 0;
            padding: 20px;
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            text-align: center;
        }

        .otp-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #0f172a;
            user-select: all;
            -webkit-user-select: all;
        }

        .disclaimer {
            font-size: 13px;
            color: #71717a;
            margin-top: 24px;
            border-top: 1px solid #f4f4f5;
            padding-top: 16px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Password Reset Request</h1>
    <p>Hi <span th:text="${displayName}">there</span>,</p>
    <p>Please enter the following 6-digit verification code in the app to reset your password:</p>
    <div class="otp-box">
        <div class="otp-code" th:text="${otpCode}">000000</div>
    </div>
    <p><strong>This code is valid for 3 minutes.</strong></p>
    <div class="disclaimer">
        <p>If you didn't request a password reset, please ignore this email or change your password if you suspect
            unauthorized activity.</p>
    </div>
</div>
</body>
</html>
