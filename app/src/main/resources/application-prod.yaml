spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

    properties:
      format_sql: false
      show_sql: false
      hibernate:
        hbm2ddl:
          create_namespaces: ${JPA_CREATE_NAMESPACES:false}

jwt:
  expiration-minutes: 15

trusted-proxy:
  require-proxy: true

rate-limit:
  ip:
    apply-limit: true
