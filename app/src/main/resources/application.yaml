server:
  port: ${PORT:8080}

spring:
  application:
    name: nerochat

  config:
    import: optional:file:local.properties

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: SpringBootHikariCP

      data-source-properties:
        tcpKeepAlive: true
        socketTimeout: 30
        connectTimeout: 10

  data:
    redis:
      repositories:
        enabled: false

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "${REDIS_PROTOCOL:redis}://${REDIS_HOST}:${REDIS_PORT}"
          password: "${REDIS_PASSWORD}"
          connectionMinimumIdleSize: ${REDIS_MIN_IDLE:2}
          connectionPoolSize: ${REDIS_POOL_SIZE:5}
          subscriptionConnectionMinimumIdleSize: ${REDIS_SUB_MIN_IDLE:1}
          subscriptionConnectionPoolSize: ${REDIS_SUB_POOL_SIZE:5}
          connectTimeout: 10000
          timeout: 3000

  jpa:
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USERNAME}
    virtual-host: ${RABBITMQ_VHOST}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-interval: 10000ms
        max-attempts: 3
        multiplier: 2
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 3
        prefetch: 10
        default-requeue-rejected: true
        retry:
          enabled: true
          initial-interval: 1000ms
          max-interval: 10000ms
          max-attempts: 3
          multiplier: 2

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET_BASE64}

otp:
  pepper: ${OTP_PEPPER}

email:
  from: ${SMTP_SENDER}

trusted-proxy:
  trusted-ips:
    - "100.64.0.0/10"   # Railway / Tailscale CGNAT
    - "172.16.0.0/12"   # Docker bridge networks (Caddy -> backend)
    - "10.0.0.0/8"      # Private VPC / OCI VCN
    - "127.0.0.1/32"    # localhost
    - "::1/128"         # IPv6 localhost
