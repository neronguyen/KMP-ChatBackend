spring:
  application:
    name: nerochat

  config:
    import: optional:file:local.properties

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: SpringBootHikariCP

      data-source-properties:
        tcpKeepAlive: true
        socketTimeout: 30
        connectTimeout: 10

  data:
    redis:
      repositories:
        enabled: false

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST}:${REDIS_PORT}"
          connectionMinimumIdleSize: 2    
          connectionPoolSize: 5         
          connectTimeout: 10000
          timeout: 3000
        
        password: "${REDIS_PASSWORD}"

  jpa:
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST}
    username: ${RABBITMQ_USERNAME}
    virtual-host: ${RABBITMQ_VHOST}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: true
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-interval: 10000ms
        max-attempts: 3
        multiplier: 2
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 3
        prefetch: 10
        default-requeue-rejected: true
        retry:
          enabled: true
          initial-interval: 1000ms
          max-interval: 10000ms
          max-attempts: 3
          multiplier: 2

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET_BASE64}

email:
  from: ${SMTP_SENDER}
  verification:
    expiry-minutes: 10
  password-reset:
    expiry-minutes: 10

trusted-proxy:
  trusted-ips:
    - "100.64.0.0/10"   # Railway
    - "127.0.0.1/32"    # localhost
    - "::1/128"         # IPv6 localhost
